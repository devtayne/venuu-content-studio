<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venuu Content Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;900&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #f0eee8; min-height: 100vh; }
  .header { padding: 1.25rem 2rem; border-bottom: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { font-family: 'DM Sans', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.5px; color: #F47B20; }
  .tagline { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-top: -2px; }
  .badge { font-size: 11px; font-weight: 500; background: rgba(244,123,32,0.15); color: #F47B20; border: 0.5px solid rgba(244,123,32,0.3); padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
  .mode-tabs { display: flex; border-bottom: 0.5px solid rgba(255,255,255,0.08); padding: 0 2rem; overflow-x: auto; }
  .mode-tab { padding: 1rem 1.5rem; font-size: 13px; font-weight: 500; color: rgba(240,238,232,0.4); border: none; background: transparent; font-family: 'DM Sans', sans-serif; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; margin-bottom: -0.5px; white-space: nowrap; }
  .mode-tab:hover { color: rgba(240,238,232,0.7); }
  .mode-tab.active { color: #F47B20; border-bottom-color: #F47B20; }
  .main { padding: 2rem; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
  .mode-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: #f0eee8; }
  .mode-sub { font-size: 13px; color: rgba(240,238,232,0.4); margin-top: 4px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(240,238,232,0.35); font-weight: 500; }
  .filter-input { background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 8px; color: #f0eee8; font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px 14px; outline: none; width: 100%; transition: border-color 0.15s; }
  .filter-input:focus { border-color: rgba(244,123,32,0.5); }
  .filter-input::placeholder { color: rgba(240,238,232,0.2); }
  .filter-textarea { background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 8px; color: #f0eee8; font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px 14px; outline: none; width: 100%; transition: border-color 0.15s; resize: vertical; min-height: 80px; line-height: 1.6; }
  .filter-textarea:focus { border-color: rgba(244,123,32,0.5); }
  .filter-textarea::placeholder { color: rgba(240,238,232,0.2); }
  .filters-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .filters-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .generate-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; background: #F47B20; color: #0a0a0f; border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; width: 100%; }
  .generate-btn:hover { background: #ff8c35; transform: translateY(-1px); }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .secondary-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; background: transparent; border: 0.5px solid rgba(244,123,32,0.3); color: #F47B20; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .secondary-btn:hover { background: rgba(244,123,32,0.08); }
  .loading-bar { height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; display: none; }
  .loading-bar.active { display: block; }
  .loading-bar-inner { height: 100%; background: #F47B20; border-radius: 2px; animation: loadingAnim 1.5s ease-in-out infinite; width: 40%; }
  @keyframes loadingAnim { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .error-msg { background: rgba(226,75,74,0.1); border: 0.5px solid rgba(226,75,74,0.2); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: rgba(240,180,180,0.9); display: none; }
  .error-msg.visible { display: block; }
  .results-area { display: flex; flex-direction: column; gap: 16px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; color: rgba(240,238,232,0.2); font-size: 13px; gap: 10px; border: 0.5px dashed rgba(255,255,255,0.07); border-radius: 12px; text-align: center; }
  .result-card { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1.25rem; animation: fadeIn 0.3s ease; transition: border-color 0.15s; }
  .result-card:hover { border-color: rgba(244,123,32,0.2); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .result-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .result-label { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #F47B20; font-weight: 500; }
  .card-actions { display: flex; gap: 6px; align-items: center; }
  .copy-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 6px; color: rgba(240,238,232,0.4); font-size: 11px; font-family: 'DM Sans', sans-serif; padding: 4px 12px; cursor: pointer; transition: all 0.15s; }
  .copy-btn:hover { border-color: rgba(244,123,32,0.4); color: #F47B20; }
  .copy-btn.copied { color: #7bc67e; border-color: rgba(123,198,126,0.3); }
  .edit-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 6px; color: rgba(240,238,232,0.4); font-size: 11px; font-family: 'DM Sans', sans-serif; padding: 4px 12px; cursor: pointer; transition: all 0.15s; }
  .edit-btn:hover { border-color: rgba(244,123,32,0.4); color: #F47B20; }
  .edit-btn.editing { color: #F47B20; border-color: rgba(244,123,32,0.4); background: rgba(244,123,32,0.08); }
  .result-text { font-size: 14px; line-height: 1.7; color: rgba(240,238,232,0.8); white-space: pre-wrap; outline: none; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; transition: background 0.15s; }
  .result-text[contenteditable="true"] { background: rgba(255,255,255,0.04); border: 0.5px solid rgba(244,123,32,0.3); padding: 8px 10px; margin: 0; cursor: text; }
  .char-count { font-size: 11px; color: rgba(240,238,232,0.25); text-align: right; margin-top: 6px; }
  .char-count.warning { color: rgba(244,123,32,0.7); }
  .char-count.over { color: rgba(226,75,74,0.8); }
  .batch-copy-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; background: transparent; border: 0.5px solid rgba(244,123,32,0.3); color: #F47B20; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; width: 100%; }
  .batch-copy-btn:hover { background: rgba(244,123,32,0.08); }
  .session-log { background: rgba(255,255,255,0.02); border: 0.5px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 1rem 1.25rem; }
  .session-log-header { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(240,238,232,0.3); margin-bottom: 10px; font-weight: 500; }
  .session-log-empty { font-size: 12px; color: rgba(240,238,232,0.2); font-style: italic; }
  .log-entry { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid rgba(255,255,255,0.05); }
  .log-entry:last-child { border-bottom: none; }
  .log-entry-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .log-mode-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; background: rgba(244,123,32,0.12); color: #F47B20; border: 0.5px solid rgba(244,123,32,0.2); flex-shrink: 0; }
  .log-entry-desc { font-size: 12.5px; color: rgba(240,238,232,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-entry-time { font-size: 11px; color: rgba(240,238,232,0.25); flex-shrink: 0; margin-left: 8px; }

  /* CAROUSEL SPECIFIC */
  .carousel-mode-row { display: flex; gap: 8px; }
  .carousel-mode-btn { flex: 1; padding: 10px; border-radius: 8px; border: 0.5px solid rgba(255,255,255,0.1); background: transparent; color: rgba(240,238,232,0.4); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: center; }
  .carousel-mode-btn:hover { border-color: rgba(244,123,32,0.3); color: rgba(240,238,232,0.7); }
  .carousel-mode-btn.active { background: rgba(244,123,32,0.12); border-color: rgba(244,123,32,0.4); color: #F47B20; }
  .series-context-box { background: rgba(244,123,32,0.05); border: 0.5px solid rgba(244,123,32,0.2); border-radius: 10px; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 10px; }
  .series-context-header { display: flex; align-items: center; justify-content: space-between; }
  .series-context-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #F47B20; font-weight: 500; }
  .series-active-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(96,192,112,0.12); color: #60c070; border: 0.5px solid rgba(96,192,112,0.3); }
  .series-inactive-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.05); color: rgba(240,238,232,0.3); border: 0.5px solid rgba(255,255,255,0.1); }
  .series-summary { font-size: 12px; color: rgba(240,238,232,0.5); line-height: 1.5; }
  .slide-counter { display: flex; align-items: center; gap: 8px; }
  .slide-counter-label { font-size: 12px; color: rgba(240,238,232,0.4); }
  .slide-dots { display: flex; gap: 4px; }
  .slide-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); transition: background 0.15s; }
  .slide-dot.done { background: #60c070; }
  .slide-dot.current { background: #F47B20; }
  .slide-builder-slides { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .generated-slide-card { background: rgba(255,255,255,0.02); border: 0.5px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 1rem 1.25rem; }
  .generated-slide-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .generated-slide-num { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #F47B20; font-weight: 500; }
  .generated-slide-prompt { font-size: 13px; line-height: 1.6; color: rgba(240,238,232,0.7); white-space: pre-wrap; outline: none; border-radius: 6px; padding: 2px 4px; transition: background 0.15s; }
  .generated-slide-prompt[contenteditable="true"] { background: rgba(255,255,255,0.04); border: 0.5px solid rgba(244,123,32,0.3); padding: 8px 10px; cursor: text; color: rgba(240,238,232,0.8); }
  .slide-card-actions { display: flex; gap: 6px; margin-top: 8px; }
  .slide-action-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(240,238,232,0.35); font-size: 11px; font-family: 'DM Sans', sans-serif; padding: 3px 10px; cursor: pointer; transition: all 0.15s; }
  .slide-action-btn:hover { border-color: rgba(244,123,32,0.3); color: #F47B20; }
  .slide-action-btn.copied { color: #7bc67e; }
  .caption-section { display: flex; flex-direction: column; gap: 8px; }

  /* SLIDES CONTAINER for Quick Generate */
  .slides-container { display: flex; flex-direction: column; gap: 12px; }
  .slide-card { background: rgba(244,123,32,0.04); border: 0.5px solid rgba(244,123,32,0.15); border-radius: 10px; padding: 1rem 1.25rem; }
  .slide-number { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #F47B20; font-weight: 500; margin-bottom: 8px; }
  .slide-prompt-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(240,238,232,0.3); margin-bottom: 6px; margin-top: 4px; }
  .slide-prompt { font-size: 13px; line-height: 1.6; color: rgba(240,238,232,0.7); white-space: pre-wrap; outline: none; border-radius: 6px; padding: 2px 4px; transition: background 0.15s; }
  .slide-prompt[contenteditable="true"] { background: rgba(255,255,255,0.04); border: 0.5px solid rgba(244,123,32,0.3); padding: 8px 10px; cursor: text; color: rgba(240,238,232,0.8); }
  .slide-actions { display: flex; gap: 6px; margin-top: 10px; }
  .slide-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(240,238,232,0.35); font-size: 11px; font-family: 'DM Sans', sans-serif; padding: 3px 10px; cursor: pointer; transition: all 0.15s; }
  .slide-btn:hover { border-color: rgba(244,123,32,0.3); color: #F47B20; }
  .slide-btn.copied { color: #7bc67e; }

  /* VISION PAGE */
  .vision-page { padding: 0; }
  .vision-hero { padding: 2.5rem 2.5rem 2rem; border-bottom: 0.5px solid rgba(255,255,255,0.07); }
  .vision-eyebrow { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #F47B20; margin-bottom: 10px; font-weight: 500; }
  .vision-title { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; line-height: 1.1; color: #f0eee8; margin-bottom: 8px; }
  .vision-title span { color: #F47B20; }
  .vision-sub { font-size: 13.5px; color: rgba(240,238,232,0.45); max-width: 520px; line-height: 1.6; }
  .pipeline { padding: 2rem 2.5rem; display: flex; flex-direction: column; gap: 0; }
  .stage-row { display: flex; align-items: stretch; position: relative; }
  .stage-row:not(:last-child)::after { content: ''; position: absolute; left: 44px; bottom: -20px; width: 1.5px; height: 20px; background: linear-gradient(to bottom, rgba(244,123,32,0.4), rgba(244,123,32,0.1)); }
  .stage { display: flex; align-items: flex-start; gap: 16px; padding: 18px 20px; background: rgba(255,255,255,0.02); border: 0.5px solid rgba(255,255,255,0.07); border-radius: 12px; flex: 1; transition: border-color 0.2s; }
  .stage:hover { border-color: rgba(244,123,32,0.25); background: rgba(244,123,32,0.03); }
  .connector-gap { height: 20px; }
  .stage-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .icon-orange { background: rgba(244,123,32,0.15); border: 0.5px solid rgba(244,123,32,0.3); }
  .icon-purple { background: rgba(120,80,220,0.15); border: 0.5px solid rgba(120,80,220,0.3); }
  .icon-blue { background: rgba(60,130,220,0.15); border: 0.5px solid rgba(60,130,220,0.3); }
  .icon-teal { background: rgba(40,180,160,0.15); border: 0.5px solid rgba(40,180,160,0.3); }
  .icon-green { background: rgba(60,180,100,0.15); border: 0.5px solid rgba(60,180,100,0.3); }
  .stage-body { flex: 1; }
  .stage-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(240,238,232,0.3); margin-bottom: 3px; font-weight: 500; }
  .stage-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: #f0eee8; margin-bottom: 5px; }
  .stage-desc { font-size: 12px; color: rgba(240,238,232,0.5); line-height: 1.55; }
  .stage-tools { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .tool-tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-orange { background: rgba(244,123,32,0.12); color: #F47B20; border: 0.5px solid rgba(244,123,32,0.25); }
  .tag-purple { background: rgba(120,80,220,0.12); color: #a080f0; border: 0.5px solid rgba(120,80,220,0.25); }
  .tag-blue { background: rgba(60,130,220,0.12); color: #6aabf0; border: 0.5px solid rgba(60,130,220,0.25); }
  .tag-green { background: rgba(60,180,100,0.12); color: #60c070; border: 0.5px solid rgba(60,180,100,0.25); }
  .tag-teal { background: rgba(40,180,160,0.12); color: #40c8b0; border: 0.5px solid rgba(40,180,160,0.25); }
  .tag-gray { background: rgba(255,255,255,0.06); color: rgba(240,238,232,0.5); border: 0.5px solid rgba(255,255,255,0.1); }
  .stage-status { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-live { background: #60c070; box-shadow: 0 0 6px rgba(96,192,112,0.5); }
  .dot-building { background: #F47B20; box-shadow: 0 0 6px rgba(244,123,32,0.4); animation: blink 2s ease-in-out infinite; }
  .dot-planned { background: rgba(255,255,255,0.15); }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .status-label { font-size: 10px; color: rgba(240,238,232,0.3); text-transform: uppercase; letter-spacing: 0.5px; }
  .vision-bottom { margin: 0 2.5rem 2rem; padding: 18px 22px; background: rgba(244,123,32,0.06); border: 0.5px solid rgba(244,123,32,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .vb-left { display: flex; flex-direction: column; gap: 3px; }
  .vb-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: #F47B20; }
  .vb-sub { font-size: 12px; color: rgba(240,238,232,0.4); line-height: 1.5; }
  .vb-right { display: flex; gap: 24px; }
  .metric { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .metric-num { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: #F47B20; }
  .metric-label { font-size: 10px; color: rgba(240,238,232,0.3); letter-spacing: 0.5px; text-transform: uppercase; }
  .vision-legend { padding: 0 2.5rem 2rem; display: flex; gap: 20px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(240,238,232,0.35); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
  /* IMAGE GENERATION */
  .img-gen-row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.06); }
  .img-gen-btn { padding: 9px 16px; background: rgba(244,123,32,0.06); border: 0.5px solid rgba(244,123,32,0.2); border-radius: 7px; color: rgba(244,123,32,0.7); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; width: 100%; text-align: center; }
  .img-gen-btn:hover { background: rgba(244,123,32,0.12); border-color: rgba(244,123,32,0.4); color: #F47B20; }
  .img-gen-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .img-preview { display: flex; flex-direction: column; gap: 8px; }
  .img-download-btn { padding: 7px 14px; background: transparent; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 6px; color: rgba(240,238,232,0.4); font-family: 'DM Sans', sans-serif; font-size: 11px; cursor: pointer; transition: all 0.15s; width: 100%; text-align: center; }
  .img-download-btn:hover { border-color: rgba(244,123,32,0.3); color: #F47B20; }
  .img-error { font-size: 12px; color: rgba(226,75,74,0.8); padding: 8px 10px; background: rgba(226,75,74,0.08); border-radius: 6px; }

  /* STYLE CHIPS */
  .style-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .style-chip { padding: 5px 13px; border-radius: 20px; border: 0.5px solid rgba(255,255,255,0.1); background: transparent; color: rgba(240,238,232,0.4); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px; white-space: nowrap; }
  .style-chip:hover { border-color: rgba(244,123,32,0.35); color: rgba(240,238,232,0.75); background: rgba(244,123,32,0.05); }
  .style-chip.active { background: rgba(244,123,32,0.15); border-color: rgba(244,123,32,0.5); color: #F47B20; }

  /* KNOWLEDGE BASE */
  .kb-page { padding: 2rem; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
  .kb-bar-card { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s; }
  .kb-bar-card:hover { border-color: rgba(244,123,32,0.2); }
  .kb-bar-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .kb-bar-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

function buildStoryPrompt(f) {

${barContext}

REQUIRED TEXT ELEMENTS — ALL of these exact words MUST appear rendered in the image. Describe each as a physical typographic element with specific font weight, size, color, placement, and visual treatment:
- ${requiredText}

PROMPT ENGINEERING RULES FOR AI IMAGE GENERATORS:
1. Describe lighting with technical precision: "warm amber practical lighting at f/1.4, ARRI Alexa color science, deep shadows with orange rim light"
2. Specify camera and lens: "shot on anamorphic lens, slight lens flare, cinematic aspect"
3. Describe text as physical objects: "massive bone-white ultra-condensed sans-serif letterforms, slightly tracked out, casting subtle drop shadow on dark background" — never say "text that reads X", say "the words [X] rendered in [specific typographic treatment]"
4. Use film and photography language: bokeh, depth of field, color grade, grain, practical lights, motivated lighting
5. Be specific about atmosphere: "smoke machine haze catching a single orange spotlight", not "moody atmosphere"
6. Every prompt must be 150-250 words — detailed enough that the image generator has no ambiguity

Make all 3 feel like completely different creative executions:
- Prompt 1 — TYPOGRAPHY HERO: Text dominates. Dramatic scale, aggressive negative space, minimal scene. The words are the design.
- Prompt 2 — ATMOSPHERIC SCENE: Cinematic bar environment in full detail. Text integrated naturally into the scene as signage, light projections, or overlays.
- Prompt 3 — GRAPHIC SYSTEM: Bold graphic design language. Geometric, illustrative, or abstract visual concept with text as part of the design system.

PROMPT ENGINEERING RULES:
1. Technical photography language: camera (ARRI Alexa, RED, Canon R5), lens (anamorphic, 85mm, 24mm), aperture (f/1.4, f/2.8), lighting type (practical, motivated, Rembrandt, rim)
2. Text as visual objects: describe the exact words to render, their typographic treatment (ultra-condensed bold white, thin italic gold, massive tracking), their placement (upper third, centered, bleeding off frame), and their relationship to the background (floating, embedded, projected)
3. Specific atmosphere: not "moody" but "single practical orange pendant light cutting through blue cigarette haze, warm spill on polished bar surface"
4. Color grade direction: "film emulation, pushed shadows, warm highlights, slight green in the midtones"
5. 200-300 words — detailed enough that the AI generator has no creative decisions to make

Return ONLY a JSON object, no markdown:
{"slidePrompt": "the full detailed image generation prompt for this specific slide"}`;
}

function buildQuickCarouselPrompt(f) {
  return `You are a visual creative director generating a complete ${f.slides || 5}-slide Instagram carousel for Venuu. Each slide prompt will be pasted separately into an AI image generator (GPT Image 2.0 or Nano Banana).

STYLE DIRECTIVE — primary creative constraint. Every visual decision must serve this aesthetic, overriding all other stylistic defaults:
${STYLES[currentStyle].directive}

POST BRIEF: ${f.brief || 'Venuu carousel post'}
CTA: ${f.cta || 'Download Venuu'}

Venuu brand: black (#0a0a0f) background, orange (#F47B20) accent. 18-28 demographic, Knoxville TN nightlife app showing live bar headcounts.

For each slide generate a DEEP, DETAILED image prompt (200-300 words each) suitable for GPT Image 2.0 or Nano Banana. Each prompt must:
- Use technical photography/cinematography language (camera, lens, lighting, color grade)
- Describe text as physical visual objects with exact typographic treatment and placement
- Feel visually cohesive with the other slides but compositionally distinct
- Be specific enough that the AI has no ambiguity about what to generate

Also generate ONE Instagram caption for the whole post.

Return ONLY a JSON object, no markdown:
{
  "caption": "single post caption, brand voice, confident, 2-3 lines, 2-3 hashtags",
  "slides": [
    {
      "slide": 1,
      "headline": "SHORT SLIDE HEADLINE",
      "imagePrompt": "full 200-300 word image generation prompt with text treatment, lighting, camera, composition, color grade, and atmosphere"
    }
  ]
}`;
}

function buildReelsPrompt(f) {
  const bar = findBarProfile(f.bar);
  const barContext = bar
    ? `Location: ${bar.fullName} — ${bar.aesthetic}. Atmosphere: ${bar.colors}. Known for: ${bar.signature}.`
    : `Location: ${f.bar || 'Knoxville nightlife'}`;
  return `You are a creative director generating content for Venuu, a premium nightlife app in Knoxville. Create a complete Instagram Reels content package.

Brief:
- Vibe: ${f.vibe || 'Saturday night'}
- Character: ${f.character || 'stylish woman in her 20s'}
- Setting: ${f.setting || 'nightlife bar scene'}
- ${barContext}

Brand voice: Confident, aspirational, sexy but never desperate. Think Don Julio meets college nightlife. The app shows live headcounts at bars so you always know where to go before you leave.

Generate exactly three things:

1. HIGGSFIELD VIDEO PROMPT — cinematic and specific. Describe camera movement (dolly, orbit, tracking shot), lighting quality and source, character movement and wardrobe, atmosphere, color grade. 150-200 words. Make it feel like a real film brief a DP would follow.

2. HOOK — first line seen or heard on screen. Under 8 words, present tense, lowercase, never explains itself, implies something happening RIGHT NOW. Creates tension through incompleteness. Examples: "radius at 9pm. you already know." or "she checked the app. grabbed her jacket."

3. CAPTION — 2-4 lines, Venuu brand voice. Confident and specific. Reference the live headcount feature naturally. End with 2-3 hashtags max. No POV, no exclamation spam, no past tense storytelling.

Return ONLY a JSON object, no markdown:
{"higgsfield_prompt":"...","hook":"...","caption":"..."}`;
}

// ─── SESSION LOG ──────────────────────────────────────────
function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addLogEntry(mode, description) {
  sessionLog.unshift({ mode, description, time: getTime() });
  renderSessionLog();
}

function renderSessionLog() {
  const container = document.getElementById('sessionLogEntries');
  if (sessionLog.length === 0) {
    container.innerHTML = '<div class="session-log-empty">Nothing generated yet this session.</div>';
    return;
  }
  const labels = { story: 'Story', carousel: 'Carousel', reels: 'Reels', slide: 'Slide', series: 'Series' };
  container.innerHTML = sessionLog.map(e => `
    <div class="log-entry">
      <div class="log-entry-left">
        <span class="log-mode-badge">${labels[e.mode] || e.mode}</span>
        <span class="log-entry-desc">${esc(e.description)}</span>
      </div>
      <span class="log-entry-time">${e.time}</span>
    </div>`).join('');
}

// ─── CAROUSEL SUB-MODE ────────────────────────────────────
function setCarouselMode(mode) {
  carouselSubMode = mode;
  renderModeContent();
}

function resetSeries() {
  seriesContext = null;
  generatedSlides = [];
  renderModeContent();
}

function copyCaption() {
  if (seriesContext && seriesContext.caption) {
    navigator.clipboard.writeText(seriesContext.caption).then(() => {
      const btn = event.target;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy Caption'; }, 2000);
    });
  }
}

// ─── API CALL ─────────────────────────────────────────────
async function callAPI(prompt) {
  const res = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt })
  });
  if (!res.ok) throw new Error(`Server error: ${res.status}`);
  return await res.json();
}

function setLoading(loading, btnId) {
  const btn = document.getElementById(btnId || 'genBtn');
  const loader = document.getElementById('loadingBar');
  const errorEl = document.getElementById('errorMsg');
  if (btn) btn.disabled = loading;
  if (loader) loader.classList.toggle('active', loading);
  if (errorEl) errorEl.classList.remove('visible');
  if (btn) btn.textContent = loading ? 'Generating...' : btn.getAttribute('data-label') || 'Generate ✦';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  if (el) { el.textContent = msg; el.classList.add('visible'); }
}

// ─── GENERATE FUNCTIONS ───────────────────────────────────
async function generateStory() {
  const f = {
    bar: val('s_bar'), event: val('s_event'), datetime: val('s_datetime'),
    deal: val('s_deal'), extra: val('s_extra')
  };
  setLoading(true);
  document.getElementById('resultsArea').innerHTML = `<div class="empty-state"><div style="font-size:32px;opacity:0.4;">◈</div><div>Building your flyer prompts...</div></div>`;
  document.getElementById('batchCopyRow').innerHTML = '';
  try {
    const data = await callAPI(buildStoryPrompt(f));
    currentData = data;
    addLogEntry('story', `${f.bar || 'Story'} · ${f.event || f.deal || 'flyer'}`);
    renderStoryResults(data);
    renderBatchCopy('story');
  } catch(e) { showError(`Something went wrong: ${e.message}`); }
  finally { setLoading(false); }
}

async function generateSeriesContext() {
  const brief = val('c_brief');
  const slides = parseInt(val('c_slides')) || 5;
  if (!brief) { showError('Please describe what this post is about.'); return; }
  setLoading(true);
  try {
    const data = await callAPI(buildSeriesContextPrompt(brief, slides, currentStyle));
    seriesContext = { ...data, totalSlides: slides, brief, style: currentStyle };
    generatedSlides = [];
    addLogEntry('series', `${data.seriesTitle || 'Carousel'} · ${slides} slides`);
    renderModeContent();
  } catch(e) { showError(`Something went wrong: ${e.message}`); }
  finally { setLoading(false); }
}

async function generateNextSlide() {
  const slideBrief = val('c_slideBrief');
  if (!slideBrief) { showError('Please describe what this slide should show.'); return; }
  if (!seriesContext) return;
  const slideNum = generatedSlides.length + 1;
  const btn = document.getElementById('slideGenBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating...'; }
  const loader = document.getElementById('loadingBar');
  if (loader) loader.classList.add('active');
  document.getElementById('errorMsg').classList.remove('visible');
  try {
    const data = await callAPI(buildSlidePrompt(slideNum, seriesContext.totalSlides, slideBrief, seriesContext));
    generatedSlides.push({ slideNum, prompt: data.slidePrompt || '' });
    addLogEntry('slide', `${seriesContext.seriesTitle} · Slide ${slideNum}`);
    renderModeContent();
    // Show batch copy if all slides done
    if (generatedSlides.length >= seriesContext.totalSlides) {
      setTimeout(() => {
        const batchRow = document.getElementById('batchCopyRow');
        if (batchRow) batchRow.innerHTML = `<button class="batch-copy-btn" onclick="batchCopySlides()">⊕ Copy All Slide Prompts</button>`;
      }, 100);
    }
  } catch(e) {
    document.getElementById('errorMsg').textContent = `Something went wrong: ${e.message}`;
    document.getElementById('errorMsg').classList.add('visible');
    if (btn) { btn.disabled = false; btn.textContent = `Generate Slide ${slideNum} ✦`; }
    if (loader) loader.classList.remove('active');
  }
}

async function generateQuickCarousel() {
  const f = { brief: val('q_brief'), slides: val('q_slides'), cta: val('q_cta') };
  setLoading(true);
  const area = document.getElementById('resultsArea');
  if (area) area.innerHTML = `<div class="empty-state"><div style="font-size:32px;opacity:0.4;">◈</div><div>Building your carousel prompts...</div></div>`;
  document.getElementById('batchCopyRow').innerHTML = '';
  try {
    const data = await callAPI(buildQuickCarouselPrompt(f));
    currentData = data;
    addLogEntry('carousel', `${f.brief ? f.brief.slice(0,40) + '...' : 'Carousel'} · ${f.slides || 5} slides`);
    renderQuickCarouselResults(data);
    renderBatchCopy('quickcarousel');
  } catch(e) { showError(`Something went wrong: ${e.message}`); }
  finally { setLoading(false); }
}

async function generateReels() {
  const f = { vibe: val('r_vibe'), character: val('r_character'), setting: val('r_setting'), bar: val('r_bar') };
  setLoading(true);
  document.getElementById('resultsArea').innerHTML = `<div class="empty-state"><div style="font-size:32px;opacity:0.4;">◈</div><div>Building your Reels package...</div></div>`;
  document.getElementById('batchCopyRow').innerHTML = '';

    { key: 'higgsfield_prompt', label: 'Higgsfield Video Prompt', limit: 9999 },
    { key: 'hook', label: 'Video Hook', limit: 100 },
    { key: 'caption', label: 'Instagram Caption', limit: 2200 }
  ];
  area.innerHTML = items.map(item => {
    const id = `result_${item.key}`;
    return `<div class="result-card">
      <div class="result-card-header">
        <div class="result-label">${item.label}</div>
        <div class="card-actions">
          <button class="edit-btn" onclick="toggleEdit(this, '${id}', ${item.limit})">Edit</button>
          <button class="copy-btn" onclick="copyEl('${id}', this)">Copy</button>
        </div>
      </div>
      <div class="result-text" id="${id}">${esc(data[item.key] || 'Not generated')}</div>
      <div class="char-count"></div>
    </div>`;
  }).join('');
}

// ─── BATCH COPY ───────────────────────────────────────────
function renderBatchCopy(mode) {
  const row = document.getElementById('batchCopyRow');
  if (row) row.innerHTML = `<button class="batch-copy-btn" onclick="batchCopyAll('${mode}')">⊕ Copy All Content</button>`;
}

function batchCopyAll(mode) {
  let text = '';
  if (mode === 'story') {
    ['prompt1','prompt2','prompt3'].forEach((k,i) => {
      if (currentData[k]) text += `PROMPT ${i+1}:\n${currentData[k]}\n\n`;
    });
  } else if (mode === 'quickcarousel') {
    if (currentData.caption) text += `CAPTION:\n${currentData.caption}\n\n`;
    (currentData.slides || []).forEach(s => {
      text += `SLIDE ${s.slide} — ${s.headline || ''}:\n${s.imagePrompt || s.image_prompt || ''}\n\n`;
    });
  } else if (mode === 'reels') {
    if (currentData.hook) text += `HOOK:\n${currentData.hook}\n\n`;
    if (currentData.caption) text += `CAPTION:\n${currentData.caption}\n\n`;
    if (currentData.higgsfield_prompt) text += `HIGGSFIELD PROMPT:\n${currentData.higgsfield_prompt}\n\n`;
  }
  navigator.clipboard.writeText(text.trim()).then(() => {
    const btn = document.querySelector('.batch-copy-btn');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = '⊕ Copy All Content'; }, 2000); }
  });
}

function batchCopySlides() {
  let text = '';
  if (seriesContext && seriesContext.caption) text += `POST CAPTION:\n${seriesContext.caption}\n\n`;
  generatedSlides.forEach(s => { text += `SLIDE ${s.slideNum}:\n${s.prompt}\n\n`; });
  navigator.clipboard.writeText(text.trim()).then(() => {
    const btn = document.querySelector('.batch-copy-btn');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = '⊕ Copy All Slide Prompts'; }, 2000); }
  });
}

// ─── EDIT IN PLACE ────────────────────────────────────────
function toggleEdit(btn, elId, limit) {
  const el = document.getElementById(elId);
  if (!el) return;
  const isEditing = el.getAttribute('contenteditable') === 'true';
  if (isEditing) {
    el.setAttribute('contenteditable', 'false');
    btn.textContent = 'Edit';
    btn.classList.remove('editing');
  } else {
    el.setAttribute('contenteditable', 'true');
    el.focus();
    btn.textContent = 'Done';
    btn.classList.add('editing');
    const countEl = el.nextElementSibling;
    if (countEl && countEl.classList.contains('char-count')) {
      function update() {
        const len = el.innerText.length;
        countEl.textContent = `${len} / ${limit}`;
        countEl.className = 'char-count' + (len > limit ? ' over' : len > limit * 0.9 ? ' warning' : '');
      }
      el.addEventListener('input', update);
      update();
    }
  }
}

function toggleEditSlide(btn, elId, limit) {
  const el = document.getElementById(elId);
  if (!el) return;
  const isEditing = el.getAttribute('contenteditable') === 'true';
  if (isEditing) {
    el.setAttribute('contenteditable', 'false');
    btn.textContent = 'Edit';
    btn.classList.remove('editing');
  } else {
    el.setAttribute('contenteditable', 'true');
    el.focus();
    btn.textContent = 'Done';
    btn.classList.add('editing');
  }
}

// ─── UTILS ────────────────────────────────────────────────
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function copyEl(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  });
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── IMAGE GENERATION ────────────────────────────────────

// Composites the Venuu logo onto a full-resolution canvas and returns a data URL.
// Called immediately after API response — both preview and download use the same composite.
async function compositeWithLogo(b64) {
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = 'data:image/png;base64,' + b64;
  });

  const W = img.naturalWidth;   // Always 1024
  const H = img.naturalHeight;  // 1536 for story, 1024 for carousel

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Draw base image at full native resolution — no scaling
  ctx.drawImage(img, 0, 0, W, H);

  // Load DM Sans 900 before measuring/drawing text
  try { await document.fonts.load("900 48px 'DM Sans'"); } catch(e) {}

  // Logo sizing — ~5% of image height for text
  const fSize  = Math.round(H * 0.05);
  const iconSz = Math.round(fSize * 1.3);
  const gap    = Math.round(fSize * 0.45);
  const padX   = Math.round(fSize * 0.85);
  const pillH  = Math.round(fSize * 1.9);
  const lw     = Math.max(2, Math.round(fSize * 0.08));

  ctx.font = `900 ${fSize}px 'DM Sans', 'Arial Black', sans-serif`;
  const textW = ctx.measureText('venuu').width;
  const pillW = padX * 2 + iconSz + gap + textW;
  const pillX = Math.round((W - pillW) / 2);
  const pillY = H - pillH - 40;

  // Dark semi-transparent pill — rgba(0,0,0,0.6), border-radius 20px
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 20);
  ctx.fill();

  const cx = pillX + padX + iconSz / 2;
  const cy = pillY + pillH / 2;
  const r  = iconSz / 2;

  ctx.strokeStyle = '#F47B20';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // V-in-circle icon: outer circle
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.85, 0, Math.PI * 2);
  ctx.stroke();

  // V-in-circle icon: V chevron
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.42, cy - r * 0.38);
  ctx.lineTo(cx, cy + r * 0.42);
  ctx.lineTo(cx + r * 0.42, cy - r * 0.38);
  ctx.stroke();

  // "venuu" wordmark
  ctx.fillStyle = '#F47B20';
  ctx.font = `900 ${fSize}px 'DM Sans', 'Arial Black', sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('venuu', pillX + padX + iconSz + gap, cy);

  return canvas.toDataURL('image/png');
}

async function generateImage(promptElId, size, btn) {
  const el = document.getElementById(promptElId);
  if (!el) return;
  const prompt = el.innerText.trim();
  if (!prompt) return;
  const previewId = 'img_' + promptElId;
  const preview = document.getElementById(previewId);
  if (!preview) return;
  const origLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generating...';
  preview.innerHTML = '';
  try {
    const res = await fetch('/api/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, quality: 'high', size })
    });
    const data = await res.json();
    console.log('Image API response:', data);
    if (!res.ok) throw new Error(data.error?.message || data.details || JSON.stringify(data.error) || 'Generation failed');

    btn.textContent = 'Compositing...';
    const ts = Date.now();
    const modePrefix = size === '1024x1536' ? 'story' : 'carousel';
    const imgId = 'imgr_' + promptElId;

    // Composite at full resolution — store the result data URL for both display and download
    const compositeUrl = await compositeWithLogo(data.image);
    imageDataStore.set(imgId, compositeUrl);

    preview.innerHTML = `<img src="${compositeUrl}" id="${imgId}" alt="Generated" style="width:100%;border-radius:8px;display:block;"><button class="img-download-btn" onclick="downloadImage('${imgId}', 'venuu-${modePrefix}-${ts}.png')">⬇ Download PNG</button>`;
    btn.textContent = 'Regenerate Image';
    btn.disabled = false;
  } catch (e) {
    console.error('Image generation error:', e);
    preview.innerHTML = `<div class="img-error">Failed: ${esc(e.message)}</div>`;
    btn.textContent = origLabel;
    btn.disabled = false;
  }
}

// Download the already-composited image — no reprocessing needed
function downloadImage(imgId, filename) {
  const dataUrl = imageDataStore.get(imgId);
  if (!dataUrl) return;
  const link = document.createElement('a');
  link.download = filename;
  link.href = dataUrl;
  link.click();
}

// ─── KNOWLEDGE BASE ──────────────────────────────────────
const TAMPA_BAR_KEYS = new Set(['m bird','lower deck','armature works','american social','511 franklin','the patio','blind goat','sunset rodeo','macdintons','boulon','predalina']);

function cssId(key) { return key.replace(/[^a-z0-9]/gi, '_'); }

function getBarCity(key, bar) {
  if (bar.city) return bar.city;
  return TAMPA_BAR_KEYS.has(key) ? 'Tampa' : 'Knoxville';
}

function cityCssClass(city) {
  if (!city) return 'kb-city-other';
  const c = city.toLowerCase();
  if (c === 'knoxville') return 'kb-city-knoxville';
  if (c === 'tampa') return 'kb-city-tampa';
  return 'kb-city-other';
}

function initKB() {
  try {
    const saved = localStorage.getItem('venuu_kb');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.keys(barKnowledgeBase).forEach(k => delete barKnowledgeBase[k]);
      Object.keys(parsed).forEach(k => { barKnowledgeBase[k] = parsed[k]; });
    }
  } catch(e) {}
}

function saveKBToStorage() {
  try { localStorage.setItem('venuu_kb', JSON.stringify(barKnowledgeBase)); } catch(e) {}
}

function renderKBPage() {
  const container = document.getElementById('kbContent');
  if (!container) return;
  const bars = Object.entries(barKnowledgeBase);
  container.innerHTML = `
    <div class="kb-page">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <div class="mode-title">Knowledge Base</div>
          <div class="mode-sub">${bars.length} bars · add, edit, or remove venue profiles</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="secondary-btn" style="font-size:11px;padding:6px 12px;opacity:0.45;" onclick="resetKBToDefaults()">Reset to defaults</button>
          <button class="secondary-btn" onclick="startAddBar()">+ Add Bar</button>
        </div>
      </div>
      <input class="filter-input" id="kb_search" placeholder="Search bars by name, city, or vibe..." oninput="filterKBBars()">
      <div id="kbAddForm" style="display:none;">
        <div class="kb-add-form-inner">
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#F47B20;font-weight:500;margin-bottom:4px;">New Bar</div>
          ${renderKBAddFields()}
          <div style="display:flex;gap:8px;margin-top:4px;">
            <button class="generate-btn" style="max-width:140px;padding:11px 20px;" onclick="saveAddBar()">Add Bar</button>
            <button class="secondary-btn" onclick="cancelAddBar()">Cancel</button>
          </div>
        </div>
      </div>
      <div id="kbBarList" style="display:flex;flex-direction:column;gap:10px;">
        ${bars.map(([key, bar]) => renderBarCard(key, bar)).join('')}
      </div>
    </div>`;
}

function renderKBAddFields() {
  const fields = [
    { id:'key',       label:'Search ID',           type:'input',    placeholder:'lowercase slug, e.g. the griffin',      hint:'Must match how users type the bar name (partial match supported)' },
    { id:'fullName',  label:'Full Name',            type:'input',    placeholder:'e.g. The Griffin Bar & Grill' },
    { id:'city',      label:'City / Market',        type:'input',    placeholder:'e.g. Tampa' },
    { id:'aesthetic', label:'Aesthetic',            type:'textarea', placeholder:'Overall visual vibe and character...' },
    { id:'colors',    label:'Colors & Lighting',    type:'textarea', placeholder:'Color palette, lighting quality...' },
    { id:'interior',  label:'Interior',             type:'textarea', placeholder:'Physical space, layout, notable features...' },
    { id:'vibe',      label:'Vibe',                 type:'textarea', placeholder:'Energy, reputation, crowd culture...' },
    { id:'crowd',     label:'Crowd (optional)',     type:'textarea', placeholder:'Who goes here...' },
    { id:'signature', label:'Signature',            type:'textarea', placeholder:'What this bar is known for...' },
  ];
  return fields.map(f => `
    <div class="filter-group">
      <div class="filter-label">${f.label}${f.hint ? ` <span style="text-transform:none;letter-spacing:0;color:rgba(240,238,232,0.25);font-size:10px;font-weight:400;">${f.hint}</span>` : ''}</div>
      ${f.type === 'input'
        ? `<input class="filter-input" id="kbadd_${f.id}" placeholder="${f.placeholder || ''}">`
        : `<textarea class="filter-textarea" id="kbadd_${f.id}" placeholder="${f.placeholder || ''}" style="min-height:56px;"></textarea>`
      }
    </div>`).join('');
}

function renderBarCard(key, bar) {
  const id = cssId(key);
  const city = getBarCity(key, bar);
  return `
    <div class="kb-bar-card" id="kb_card_${id}">
      <div class="kb-bar-header">
        <div class="kb-bar-info">
          <div class="kb-bar-meta">
            <span class="kb-city-badge ${cityCssClass(city)}">${esc(city)}</span>
            <span class="kb-bar-name">${esc(bar.fullName || key)}</span>
          </div>
          <span class="kb-bar-key">"${esc(key)}"</span>
        </div>
        <div class="kb-bar-actions">
          <button class="secondary-btn" style="padding:5px 12px;font-size:11px;" data-barkey="${esc(key)}" onclick="startEditBar(this.dataset.barkey)">Edit</button>
          <button class="danger-btn" data-barkey="${esc(key)}" onclick="deleteBar(this.dataset.barkey)">Delete</button>
        </div>
      </div>
      <div class="kb-preview-text">${esc(bar.aesthetic || '')}</div>
      <div class="kb-edit-form" id="kb_edit_${id}" style="display:none;">
        ${renderBarEditFields(key, bar)}
      </div>
    </div>`;
}

function renderBarEditFields(key, bar) {
  const id = cssId(key);
  const city = getBarCity(key, bar);
  const fields = [
    { id:'fullName',  label:'Full Name',         type:'input',    val: bar.fullName  || '' },
    { id:'city',      label:'City / Market',     type:'input',    val: city },
    { id:'aesthetic', label:'Aesthetic',         type:'textarea', val: bar.aesthetic || '' },
    { id:'colors',    label:'Colors & Lighting', type:'textarea', val: bar.colors    || '' },
    { id:'interior',  label:'Interior',          type:'textarea', val: bar.interior  || '' },
    { id:'vibe',      label:'Vibe',              type:'textarea', val: bar.vibe      || '' },
    { id:'crowd',     label:'Crowd (optional)',  type:'textarea', val: bar.crowd     || '' },
    { id:'signature', label:'Signature',         type:'textarea', val: bar.signature || '' },
  ];
  return fields.map(f => `
    <div class="filter-group">
      <div class="filter-label">${f.label}</div>
      ${f.type === 'input'
        ? `<input class="filter-input" id="kbe_${id}_${f.id}" value="${esc(f.val)}">`
        : `<textarea class="filter-textarea" id="kbe_${id}_${f.id}" style="min-height:56px;">${esc(f.val)}</textarea>`
      }
    </div>`).join('') + `
  <div style="display:flex;gap:8px;margin-top:4px;">
    <button class="generate-btn" style="max-width:120px;padding:11px 20px;" data-barkey="${esc(key)}" onclick="saveEditBar(this.dataset.barkey)">Save</button>
    <button class="secondary-btn" data-barkey="${esc(key)}" onclick="cancelEditBar(this.dataset.barkey)">Cancel</button>
  </div>`;
}

function startEditBar(key) {
  document.querySelectorAll('.kb-edit-form').forEach(f => { f.style.display = 'none'; });
  const form = document.getElementById('kb_edit_' + cssId(key));
  if (form) { form.style.display = 'flex'; form.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

function cancelEditBar(key) {
  const form = document.getElementById('kb_edit_' + cssId(key));
  if (form) form.style.display = 'none';
}

function saveEditBar(key) {
  const id = cssId(key);
  const g = f => { const el = document.getElementById(`kbe_${id}_${f}`); return el ? el.value.trim() : ''; };
  const fullName = g('fullName');
  if (!fullName) { alert('Full name is required.'); return; }
  const updated = { fullName, aesthetic: g('aesthetic'), colors: g('colors'), interior: g('interior'), vibe: g('vibe'), signature: g('signature') };
  const crowd = g('crowd'); if (crowd) updated.crowd = crowd;
  const city  = g('city');  if (city)  updated.city  = city;
  barKnowledgeBase[key] = updated;
  saveKBToStorage();
  renderKBPage();
  setTimeout(() => { const c = document.getElementById('kb_card_' + id); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
}

function deleteBar(key) {
  const name = barKnowledgeBase[key]?.fullName || key;
  if (!confirm(`Delete "${name}"?\n\nThis removes it from the knowledge base. Use "Reset to defaults" to restore all original bars.`)) return;
  delete barKnowledgeBase[key];
  saveKBToStorage();
  renderKBPage();
}

function startAddBar() {
  const form = document.getElementById('kbAddForm');
  if (form) { form.style.display = 'block'; form.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

function cancelAddBar() {
  const form = document.getElementById('kbAddForm');
  if (form) form.style.display = 'none';
}

function saveAddBar() {
  const keyEl = document.getElementById('kbadd_key');
  const key = keyEl ? keyEl.value.trim().toLowerCase() : '';
  if (!key) { alert('Search ID is required.'); return; }
  if (barKnowledgeBase[key]) { alert(`A bar with ID "${key}" already exists. Use a different search ID.`); return; }
  const g = f => { const el = document.getElementById('kbadd_' + f); return el ? el.value.trim() : ''; };
  const fullName = g('fullName');
  if (!fullName) { alert('Full name is required.'); return; }
  const bar = { fullName };
  ['aesthetic','colors','interior','vibe','crowd','signature'].forEach(f => { const v = g(f); if (v) bar[f] = v; });
  const city = g('city'); if (city) bar.city = city;
  barKnowledgeBase[key] = bar;
  saveKBToStorage();
  renderKBPage();
  setTimeout(() => { const c = document.getElementById('kb_card_' + cssId(key)); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
}

function filterKBBars() {
  const q = (document.getElementById('kb_search')?.value || '').toLowerCase();
  document.querySelectorAll('.kb-bar-card').forEach(card => {
    card.style.display = card.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function resetKBToDefaults() {
  if (!confirm('Reset to default bar list?\n\nAll edits and additions will be lost. The page will reload.')) return;
  localStorage.removeItem('venuu_kb');
  location.reload();
}

// ─── INIT ─────────────────────────────────────────────────
initKB();
renderModeContent();
</script>
